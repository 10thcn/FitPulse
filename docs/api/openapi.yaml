openapi: 3.0.3

info:
  title: FitPulse API
  description: |
    FitPulse 健身动作矫正 & 居家锻炼智能 Agent 的后端 REST API 定义（**草稿 v0.1**）。

    本文档依据《FitPulse 系统设计说明书》§4「接口设计」与 §5「数据结构设计」编写，
    并把表格中的接口落成可直接用于 Swagger UI / 代码生成 / 契约测试的 OpenAPI 描述。

    ## 约定摘要
    - 所有业务接口以 `/api` 为路径前缀，JSON 请求/响应统一 UTF-8。
    - 除 `GET /api/health` 与认证接口外，均需要 `Authorization: Bearer <JWT>`。
    - 除健康检查外，JSON 响应统一使用信封：`{ "code": 0, "message": "success", "data": ... }`。
    - 列表接口统一分页：`data = { items, total, page, page_size }`。
    - 对话与纠错等长耗时任务使用 SSE（`text/event-stream`）流式返回。
    - 时间统一为 ISO 8601（如 `2026-11-08T17:30:00+08:00`），日期为 `YYYY-MM-DD`。

    ## 草稿说明
    标注「（草稿提案）」的接口/字段是对系统设计说明书的补齐（登录、刷新令牌、文件上传、
    后台管理 REST 化、分页等），需在接口评审时确认。完整说明见
    `docs/FitPulse_API接口设计说明书.md`。
  version: 0.1.0
  contact:
    name: FitPulse 团队 · 徐心铭（后端/API 集成）
  license:
    name: 课程作业，仅供学习交流
    url: https://github.com/power819/FitPulse

servers:
  - url: http://localhost:8000
    description: 本地开发（uvicorn 直连后端）
  - url: http://localhost
    description: Docker Compose（Nginx 反向代理，/api 前缀路由到后端）

security:
  - bearerAuth: []

tags:
  - name: 健康检查
    description: 探活与监控接口
  - name: 认证
    description: 登录、刷新令牌（草稿提案）
  - name: 文件上传
    description: 聊天图片 / 头像上传（草稿提案）
  - name: 对话
    description: 会话创建、消息发送（SSE）、会话历史
  - name: 训练计划
    description: 计划生成（SSE）、当前计划、打卡、历史
  - name: 动作纠错
    description: 上传动作照片纠错（SSE）、纠错历史与详情
  - name: 用户
    description: 用户档案与训练统计
  - name: 动作库
    description: 标准动作列表与详情
  - name: 后台管理
    description: 知识库、用户、系统概览、反馈管理（需管理员 JWT）

paths:
  /api/health:
    get:
      tags: [健康检查]
      operationId: getHealth
      summary: 健康检查
      description: 供 Docker healthcheck、Nginx 探活与监控使用。**不套用统一响应信封**，直接返回健康状态。
      security: []
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 0.1.0
                timestamp: '2026-11-08T17:30:00+08:00'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/auth/login:
    post:
      tags: [认证]
      operationId: login
      summary: 登录（草稿提案）
      description: |
        使用账号密码换取 JWT。系统设计说明书提到「API 网关（Nginx + JWT）」，但未定义登录接口，本草稿补齐。
        账号体系（学号 / 邮箱 / 手机号）待产品经理确认。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: '102401531'
              password: 'FitPulse@2026'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenData'
              example:
                code: 0
                message: success
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type: Bearer
                  expires_in: 7200
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/refresh:
    post:
      tags: [认证]
      operationId: refreshToken
      summary: 刷新访问令牌（草稿提案）
      description: 使用 `refresh_token` 换取新的访问令牌。访问令牌过期（40101）时由前端静默调用。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/uploads:
    post:
      tags: [文件上传]
      operationId: uploadFile
      summary: 上传文件（草稿提案）
      description: |
        上传图片到 MinIO 并返回可访问 URL，供 `/api/chat` 的 `images[]` 与用户头像使用。
        系统设计说明书只定义了纠错图片的 multipart 上传，未定义聊天图片上传，本草稿补齐。
        限制：JPG / PNG / WebP，单文件 ≤ 10MB。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片文件，JPG / PNG / WebP，≤ 10MB
                purpose:
                  type: string
                  enum: [chat_image, avatar]
                  default: chat_image
                  description: 用途，决定存储目录与访问策略
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadedFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/chat:
    post:
      tags: [对话]
      operationId: sendChatMessage
      summary: 发送消息（SSE 流式响应）
      description: |
        发送一条用户消息，后端编排（意图识别 → RAG / 工具调用 → LLM）后以 SSE 流式返回。

        **SSE 协议**：每个事件的 `data` 是一行 `StreamEvent` JSON，事件之间以空行分隔：

        ```
        data: {"type":"thinking","content":"正在分析你的需求..."}

        data: {"type":"tool_call","tool":"generate_plan","status":"running"}

        data: {"type":"text","content":"好的！根据你的情况（新手、宿舍、瑜伽垫+弹力带），"}

        data: {"type":"done"}
        ```

        前端用 `fetch` + `ReadableStream` 读取（原生 `EventSource` 不支持 POST）。
        `text` 事件为增量片段，按到达顺序拼接。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              session_id: 6f1c2a8e-6b1a-4e8e-9d2f-1a2b3c4d5e6f
              message: 我想练胸，给我一个 20 分钟的居家计划
              images: []
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 事件流，每个事件 `data` 为 StreamEvent JSON；事件类型见 StreamEvent。
              example: |
                data: {"type":"thinking","content":"正在分析你的需求..."}

                data: {"type":"tool_call","tool":"generate_plan","status":"running"}

                data: {"type":"text","content":"好的！根据你的情况（新手、宿舍、瑜伽垫+弹力带），"}

                data: {"type":"text","content":"我为你设计了一份 20 分钟的居家胸部训练计划..."}

                data: {"type":"done"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/sessions:
    post:
      tags: [对话]
      operationId: createSession
      summary: 创建新会话
      description: 创建一个空的对话会话，返回 `session_id` 供 `/api/chat` 使用。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 60
                  description: 可选的会话标题；不传则由首条消息自动生成
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/sessions/{session_id}:
    get:
      tags: [对话]
      operationId: getSession
      summary: 获取会话历史
      description: 返回会话元信息与全部消息（按时间升序），用于前端刷新后恢复对话。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [对话]
      operationId: deleteSession
      summary: 删除会话
      description: 逻辑删除会话及其消息（同时清理会话向量上下文缓存）。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SuccessData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/plans/current:
    get:
      tags: [训练计划]
      operationId: getCurrentPlan
      summary: 获取当前周训练计划
      description: 返回 `status=active` 且覆盖当前日期的计划；尚未生成计划时返回 404（code=40400）。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TrainingPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/plans/generate:
    post:
      tags: [训练计划]
      operationId: generatePlan
      summary: 生成训练计划（SSE 流式响应）
      description: |
        根据用户档案（水平 / 目标 / 器械 / 每周天数）生成结构化周计划，以 SSE 返回生成过程。

        事件序列：`thinking` → `tool_call`（tool=generate_plan）→ 若干 `text` → `plan`（携带完整
        TrainingPlan）→ `done`。生成成功后计划自动落库并成为当前计划。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanGenerateRequest'
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 事件流，`plan` 事件的 data 为 TrainingPlan。
              example: |
                data: {"type":"thinking","content":"正在结合你的档案与知识库编排计划..."}

                data: {"type":"tool_call","tool":"generate_plan","status":"running"}

                data: {"type":"text","content":"已按每周 3 天全身训练为你编排..."}

                data: {"type":"plan","data":{"plan_id":"9b2f...","week_number":1,"days":[]}}

                data: {"type":"done"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/plans/{plan_id}/days/{day_index}/exercises/{ex_idx}:
    put:
      tags: [训练计划]
      operationId: markExerciseDone
      summary: 标记计划动作完成状态
      description: 对某计划某训练日的某个动作打卡/取消打卡，用于训练记录与进度统计。
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/DayIndex'
        - $ref: '#/components/parameters/ExerciseIndex'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkDoneRequest'
            example:
              done: true
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SuccessData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/plans/history:
    get:
      tags: [训练计划]
      operationId: getPlanHistory
      summary: 历史计划列表
      description: 分页返回用户的历史训练计划（按开始日期倒序）。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/TrainingPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/correct:
    post:
      tags: [动作纠错]
      operationId: correctPosture
      summary: 上传动作照片纠错（SSE 流式响应）
      description: |
        上传动作照片（+ 可选文字描述），后端调用 Claude 视觉模型 + RAG 知识检索识别姿势偏差，
        以 SSE 流式返回分析过程，最终 `correction` 事件携带完整纠错报告。

        事件序列：`thinking` → `tool_call`（tool=correct_posture）→ 若干 `text` → `correction` →
        `done`。若描述/图片提示疼痛等风险信号，报告中的 `safety_note` 会给出停止训练并就医的建议。

        注意：SSE 由 `fetch` + `FormData` 发起，不能使用 `EventSource`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: 动作照片，JPG / PNG / WebP，≤ 10MB
                description:
                  type: string
                  maxLength: 500
                  description: 用户文字描述，如「做俯卧撑感觉腰酸」
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 事件流，`correction` 事件的 data 为 CorrectionReport。
              example: |
                data: {"type":"thinking","content":"正在识别动作并检索标准动作知识..."}

                data: {"type":"tool_call","tool":"correct_posture","status":"running"}

                data: {"type":"text","content":"识别为俯卧撑，检测到塌腰..."}

                data: {"type":"correction","data":{"correction_id":"c7d8...","detected_exercise":"俯卧撑","issues":[]}}

                data: {"type":"done"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/correct/history:
    get:
      tags: [动作纠错]
      operationId: getCorrectionHistory
      summary: 纠错历史列表
      description: |
        分页返回用户的纠错记录（按创建时间倒序）。
        **路由优先级**：后端需先注册 `/api/correct/history`，再注册 `/api/correct/{correction_id}`，
        否则 `history` 会被当作路径参数。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/CorrectionReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/correct/{correction_id}:
    get:
      tags: [动作纠错]
      operationId: getCorrection
      summary: 纠错详情
      parameters:
        - name: correction_id
          in: path
          required: true
          description: 纠错记录 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CorrectionReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/user/profile:
    get:
      tags: [用户]
      operationId: getUserProfile
      summary: 获取当前用户档案
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [用户]
      operationId: updateUserProfile
      summary: 更新当前用户档案
      description: 全量更新用户档案（除头像外的业务字段均必填），用于「个人中心」表单保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileInput'
            example:
              nickname: 小林
              fitness_level: beginner
              goal: build_muscle
              equipment: [瑜伽垫, 弹力带]
              weekly_days: 3
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/user/stats:
    get:
      tags: [用户]
      operationId: getUserStats
      summary: 训练统计
