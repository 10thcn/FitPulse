components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        登录后获得的访问令牌，放在请求头 `Authorization: Bearer <access_token>`。
        后台管理接口要求令牌携带 `role=admin` 声明。

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      description: 会话 ID
      schema:
        type: string
        format: uuid
    PlanId:
      name: plan_id
      in: path
      required: true
      description: 训练计划 ID
      schema:
        type: string
        format: uuid
    DayIndex:
      name: day_index
      in: path
      required: true
      description: 训练日序号（1–7）
      schema:
        type: integer
        minimum: 1
        maximum: 7
    ExerciseIndex:
      name: ex_idx
      in: path
      required: true
      description: 动作在当日计划中的下标（从 0 开始，对应 sort_order）
      schema:
        type: integer
        minimum: 0
    ChunkId:
      name: chunk_id
      in: path
      required: true
      description: 知识条目 ID
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数（1–50）
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10

  responses:
    BadRequest:
      description: 参数校验失败（HTTP 400，业务码 40001）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40001
            message: '参数校验失败：缺少必填字段 message'
            data: null
    Unauthorized:
      description: 未登录或令牌无效/过期（HTTP 401，业务码 40100 / 40101）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40101
            message: 登录已过期，请重新登录
            data: null
    Forbidden:
      description: 无权限（HTTP 403，业务码 40300）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40300
            message: 需要管理员权限
            data: null
    NotFound:
      description: 资源不存在（HTTP 404，业务码 40400）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40400
            message: 资源不存在
            data: null
    PayloadTooLarge:
      description: 文件过大或格式不支持（HTTP 413，业务码 50003）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 50003
            message: '图片上传失败：仅支持 JPG/PNG/WebP，且不超过 10MB'
            data: null
    TooManyRequests:
      description: 请求过于频繁（HTTP 429，业务码 42900），带 `Retry-After` 响应头
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 42900
            message: 操作太频繁，请稍等片刻
            data: null
    InternalError:
      description: 服务器内部错误（HTTP 500，业务码 50000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 50000
            message: 系统异常，请稍后重试
            data: null
    ServiceUnavailable:
      description: 依赖服务不可用（HTTP 503，业务码 50001 / 50002：LLM 或向量库异常）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 50001
            message: 智能教练暂时繁忙，请稍后再试
            data: null

  schemas:
    ApiResponse:
      type: object
      description: 统一成功响应信封
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
          description: 业务错误码，0 表示成功
          example: 0
        message:
          type: string
          description: 提示信息
          example: success
        data:
          type: object
          nullable: true
          description: 业务数据（对象）；成功时为各接口定义的数据结构，失败时为 null

    ErrorResponse:
      type: object
      description: 统一错误响应信封
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
          description: 业务错误码（见接口文档错误码表）
          example: 40001
        message:
          type: string
          description: 可直接展示给用户的错误信息
          example: 参数校验失败
        data:
          type: object
          nullable: true
          description: 错误详情（通常为 null）

    SuccessData:
      type: object
      description: 仅表示操作结果的简单数据结构
      required: [success]
      properties:
        success:
          type: boolean
          example: true

    PageMeta:
      type: object
      description: 分页元信息（与 items 组合使用）
      required: [total, page, page_size]
      properties:
        total:
          type: integer
          description: 总条数
          example: 120
        page:
          type: integer
          description: 当前页码
          example: 1
        page_size:
          type: integer
          description: 每页条数
          example: 10

    HealthResponse:
      type: object
      description: 健康检查响应（不套用响应信封）
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          example: ok
        version:
          type: string
          example: 0.1.0
        timestamp:
          type: string
          format: date-time
          example: '2026-11-08T17:30:00+08:00'

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 登录账号，暂定为学号（待产品确认）
          example: '102401531'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: 'FitPulse@2026'

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: 登录时下发的刷新令牌

    TokenData:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: JWT 访问令牌
        token_type:
          type: string
          enum: [Bearer]
          example: Bearer
        expires_in:
          type: integer
          description: 访问令牌有效期（秒）
          example: 7200
        refresh_token:
          type: string
          description: 刷新令牌（有效期 7 天）
        user_id:
          type: string
          format: uuid
          description: 当前用户 ID，便于前端首次登录后直接初始化

    UploadedFile:
      type: object
      required: [file_id, url, size, content_type]
      properties:
        file_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: MinIO 上可访问的文件 URL（可能为预签名地址）
          example: http://localhost:9000/fitpulse/chat/2026/11/08/abc.jpg
        size:
          type: integer
          format: int64
          description: 文件字节数
          example: 204800
        content_type:
          type: string
          example: image/jpeg
        created_at:
          type: string
          format: date-time

    ChatRequest:
      type: object
      required: [session_id, message]
      properties:
        session_id:
          type: string
          format: uuid
          description: 会话 ID，由 `POST /api/sessions` 创建
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: 用户消息文本
          example: 我想练胸，给我一个计划
        images:
          type: array
          maxItems: 3
          description: 图片 URL 列表，先通过 `POST /api/uploads` 上传获得
          items:
            type: string
            format: uri

    StreamEvent:
      type: object
      description: SSE 事件负载（`data:` 行内的 JSON）
      required: [type]
      properties:
        type:
          type: string
          enum: [thinking, tool_call, text, plan, correction, done, error]
          description: |
            - `thinking`：思考/进度提示（content）
            - `tool_call`：工具调用状态（tool + status）
            - `text`：增量文本片段（content，按序拼接）
            - `plan`：完整训练计划（data = TrainingPlan）
            - `correction`：完整纠错报告（data = CorrectionReport）
            - `done`：流正常结束
            - `error`：流内错误（error）
        content:
          type: string
          description: type=thinking/text 时的事件内容
        tool:
          type: string
          description: type=tool_call 时的工具名
          enum: [query_exercise, generate_plan, correct_posture]
        status:
          type: string
          enum: [running, succeeded, failed]
          description: type=tool_call 时的执行状态
        data:
          type: object
          nullable: true
          description: type=plan/correction 时的结构化结果
        error:
          type: object
          nullable: true
          description: type=error 时的错误信息
          properties:
            code:
              type: integer
              example: 50001
            message:
              type: string
              example: LLM 调用失败

    ChatMessage:
      type: object
      required: [message_id, role, content, created_at]
      properties:
        message_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, tool, system]
        content:
          type: string
          description: 消息文本；assistant 消息为完整回答（非增量）
        images:
          type: array
          items:
            type: string
            format: uri
          description: 消息附带的图片 URL
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
          description: assistant 消息触发的工具调用记录
        created_at:
          type: string
          format: date-time

    ToolCall:
      type: object
      required: [tool_name, status]
      properties:
        tool_name:
          type: string
          enum: [query_exercise, generate_plan, correct_posture]
        arguments:
          type: object
          additionalProperties: true
          description: 工具入参
        result:
          type: string
          nullable: true
          description: 工具返回结果摘要（JSON 字符串）
        status:
          type: string
          enum: [running, succeeded, failed]

    Session:
      type: object
      required: [session_id, created_at, updated_at]
      properties:
        session_id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          description: 会话标题（由首条消息自动生成）
        message_count:
          type: integer
          minimum: 0
          description: 消息条数
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            messages:
              type: array
              description: 会话消息，按创建时间升序
              items:
                $ref: '#/components/schemas/ChatMessage'

    UserProfile:
      type: object
      required:
        [user_id, nickname, fitness_level, goal, equipment, weekly_days, created_at, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
          readOnly: true
        nickname:
          type: string
          minLength: 1
          maxLength: 30
          example: 小林
        avatar_url:
          type: string
          format: uri
          nullable: true
        fitness_level:
          type: string
          enum: [beginner, intermediate, advanced]
          description: 健身水平
        goal:
          type: string
          enum: [lose_fat, build_muscle, improve_posture, general]
          description: 训练目标
        equipment:
          type: array
          description: 可用器械
          items:
            type: string
          example: [瑜伽垫, 弹力带]
        weekly_days:
          type: integer
          minimum: 1
          maximum: 7
          description: 每周可训练天数
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    UserProfileInput:
      type: object
      description: 用户档案更新请求体
      required: [nickname, fitness_level, goal, equipment, weekly_days]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 30
        avatar_url:
          type: string
          format: uri
          nullable: true
        fitness_level:
          type: string
          enum: [beginner, intermediate, advanced]
        goal:
          type: string
          enum: [lose_fat, build_muscle, improve_posture, general]
        equipment:
          type: array
          items:
            type: string
          maxItems: 10
        weekly_days:
          type: integer
          minimum: 1
          maximum: 7

    UserStats:
      type: object
      description: 训练统计（个人中心）
      required: [total_workouts, total_minutes, current_streak_days, weekly]
      properties:
        total_workouts:
          type: integer
          minimum: 0
          description: 累计完成训练次数（按训练日计）
          example: 18
        total_minutes:
          type: integer
          minimum: 0
          description: 累计训练时长（分钟）
          example: 460
        current_streak_days:
          type: integer
          minimum: 0
          description: 当前连续打卡天数
          example: 6
        weekly:
          type: array
          description: 最近 7 天完成情况
          items:
            $ref: '#/components/schemas/WeeklyStat'

    WeeklyStat:
      type: object
      required: [date, completed_exercises, total_exercises]
      properties:
        date:
          type: string
          format: date
          example: '2026-11-08'
        completed_exercises:
          type: integer
          minimum: 0
          example: 4
        total_exercises:
          type: integer
          minimum: 0
          example: 5

    Exercise:
      type: object
      required:
        [exercise_id, name, category, target_muscles, difficulty, instructions, source]
      properties:
        exercise_id:
          type: string
        name:
          type: string
          example: 俯卧撑
        category:
          type: string
          enum: [胸, 背, 腿, 肩, 核心, 全身]
        target_muscles:
          type: array
          items:
            type: string
          example: [胸大肌, 肱三头肌]
        synergists:
          type: array
          items:
            type: string
          example: [三角肌前束, 核心]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        equipment_needed:
          type: string
          description: 所需器械；无器械时为「无器械」
          example: 瑜伽垫
        instructions:
          type: string
          description: 动作要领（Markdown）
        breathing:
          type: string
          description: 呼吸方法
          example: 下放吸气，推起呼气
        tempo:
          type: string
          description: 节奏，如 2-1-2（下放-停顿-推起，单位秒）
          example: 2-1-2
        image_urls:
          type: array
          items:
            type: string
            format: uri
        common_errors:
          type: array
          items:
            type: string
          example: [塌腰, 耸肩, 手肘外展过大]
        source:
          type: string
          description: 知识出处
          example: 《运动解剖学》第5章·上肢训练

    PlanExercise:
      type: object
      required: [id, exercise_id, exercise_name, sets, reps, rest_seconds, done, sort_order]
      properties:
        id:
          type: string
          description: 计划动作条目 ID
        exercise_id:
          type: string
          description: 关联动作 ID
        exercise_name:
          type: string
          description: 动作名称（冗余字段，减少查询）
        sets:
          type: integer
          minimum: 1
          example: 3
        reps:
          type: integer
          minimum: 1
          example: 12
        rest_seconds:
          type: integer
          minimum: 0
          example: 60
        notes:
          type: string
          nullable: true
          description: 教练备注
        done:
          type: boolean
          example: false
        sort_order:
          type: integer
          minimum: 0

    PlanDay:
      type: object
      required: [day_id, day_index, focus_area, estimated_minutes, completed, exercises]
      properties:
        day_id:
          type: string
          format: uuid
        day_index:
          type: integer
          minimum: 1
          maximum: 7
        focus_area:
          type: string
          example: 胸部+三头
        estimated_minutes:
          type: integer
          minimum: 1
          example: 20
        completed:
          type: boolean
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/PlanExercise'

    TrainingPlan:
      type: object
      required:
        [plan_id, user_id, week_number, start_date, end_date, status, explanation, days]
      properties:
        plan_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        week_number:
          type: integer
          minimum: 1
          description: 第几周
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum: [active, completed, abandoned]
        explanation:
          type: string
          description: 计划选择理由说明
        days:
          type: array
          items:
            $ref: '#/components/schemas/PlanDay'
        created_at:
          type: string
          format: date-time

    CorrectionIssue:
      type: object
      required: [issue_id, body_part, problem_description, correction_advice, severity]
      properties:
        issue_id:
          type: string
        body_part:
          type: string
          description: 问题部位
          example: 腰部
        problem_description:
          type: string
          description: 问题描述
          example: 核心未收紧导致塌腰
        correction_advice:
          type: string
          description: 纠正建议
          example: 收紧腹部与臀部，保持头-背-髋一条直线
        reference_image_url:
          type: string
          format: uri
          nullable: true
          description: 纠正参考图
        severity:
          type: string
          enum: [mild, moderate, severe]

    CorrectionReport:
      type: object
      required:
        [correction_id, user_id, image_url, detected_exercise, overall_assessment, issues, created_at]
      properties:
        correction_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        image_url:
          type: string
          format: uri
        user_description:
          type: string
          nullable: true
        detected_exercise:
          type: string
          description: 识别出的动作名称
          example: 俯卧撑
        overall_assessment:
          type: string
          description: 整体评价
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CorrectionIssue'
        safety_note:
          type: string
          nullable: true
          description: 安全提示（出现疼痛等风险信号时的就医建议）
        created_at:
          type: string
          format: date-time

    MarkDoneRequest:
      type: object
      required: [done]
      properties:
        done:
          type: boolean

    PlanGenerateRequest:
      type: object
      description: 生成训练计划请求体；可省略，省略时使用当前用户档案
      properties:
        user_profile:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserProfileInput'
          description: 可选，临时覆盖当前用户档案（如预览不同参数下的计划）

    KnowledgeChunk:
      type: object
      required: [chunk_id, module, content, tags, source, created_at]
      properties:
        chunk_id:
          type: string
          format: uuid
        module:
          type: string
          enum: [standard_action, muscle_engagement, posture_hazard]
          description: 知识模块（标准动作 / 肌肉发力 / 错误姿势危害）
        exercise_id:
          type: string
          nullable: true
          description: 关联动作 ID，可为空
        exercise_name:
          type: string
          nullable: true
        content:
          type: string
          description: 知识内容（Markdown）
        tags:
          type: array
          items:
            type: string
          example: [深蹲, 下肢, 臀腿, 新手]
        source:
          type: string
          description: 出处
          example: 《运动解剖学》第5章·下肢训练
        created_at:
          type: string
          format: date-time

    KnowledgeChunkInput:
      type: object
      required: [module, content, tags, source]
      properties:
        module:
          type: string
          enum: [standard_action, muscle_engagement, posture_hazard]
        exercise_id:
          type: string
          nullable: true
        exercise_name:
          type: string
          nullable: true
        content:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
          minItems: 1
        source:
          type: string
          minLength: 1

    AdminUser:
      type: object
      required: [user_id, nickname, fitness_level, goal, weekly_days, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        nickname:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
        fitness_level:
          type: string
          enum: [beginner, intermediate, advanced]
        goal:
          type: string
          enum: [lose_fat, build_muscle, improve_posture, general]
        weekly_days:
          type: integer
          minimum: 1
          maximum: 7
        created_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
          nullable: true

    DashboardStats:
      type: object
      required:
        [total_users, new_users_7d, total_plans, total_corrections, total_knowledge_chunks, generated_at]
      properties:
        total_users:
          type: integer
          minimum: 0
        new_users_7d:
          type: integer
          minimum: 0
        total_plans:
          type: integer
          minimum: 0
        total_corrections:
          type: integer
          minimum: 0
        total_knowledge_chunks:
          type: integer
          minimum: 0
        knowledge_by_module:
          $ref: '#/components/schemas/KnowledgeCountByModule'
        llm_success_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: LLM 调用成功率（近 24 小时）
        avg_response_ms:
          type: integer
          minimum: 0
          description: 平均响应时间（毫秒，近 24 小时）
        generated_at:
          type: string
          format: date-time

    KnowledgeCountByModule:
      type: object
      properties:
        standard_action:
          type: integer
          minimum: 0
        muscle_engagement:
          type: integer
          minimum: 0
        posture_hazard:
          type: integer
          minimum: 0

    Feedback:
      type: object
      required: [feedback_id, user_id, type, content, status, created_at, updated_at]
      properties:
        feedback_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [bug, suggestion, other]
        content:
          type: string
        status:
          type: string
          enum: [pending, processing, resolved, rejected]
        admin_reply:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FeedbackUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, processing, resolved, rejected]
        admin_reply:
          type: string
          maxLength: 1000
