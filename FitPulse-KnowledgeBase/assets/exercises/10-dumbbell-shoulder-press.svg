    <path class="ink" d="M915 328 L922 252 L926 190"/>
    <line x1="845" y1="448" x2="895" y2="448" class="ink2"/>
    <path class="ink" d="M845 448 L835 520 L835 585"/>
    <path class="ink" d="M895 448 L905 520 L905 585"/>
    <line x1="835" y1="585" x2="810" y2="585" class="ink2" opacity=".35"/>
    <line x1="905" y1="585" x2="930" y2="585" class="ink2" opacity=".35"/>
    <circle class="head" cx="870" cy="258" r="26"/>
    <path class="ink2" d="M870 283 L870 315"/>
