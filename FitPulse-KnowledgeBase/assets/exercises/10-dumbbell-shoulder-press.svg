  <g>
    <ellipse class="muscle" cx="250" cy="330" rx="25" ry="22"/>
    <ellipse class="muscle" cx="350" cy="330" rx="25" ry="22"/>
    <ellipse class="muscle" cx="230" cy="378" rx="18" ry="27"/>
    <ellipse class="muscle" cx="370" cy="378" rx="18" ry="27"/>
    <path class="back" d="M256 448 L250 520 L250 585 M344 448 L350 520 L350 585"/>
    <path class="ink" d="M300 315 L300 448"/>
    <line x1="255" y1="328" x2="345" y2="328" class="ink2"/>
    <path class="ink" d="M255 328 L222 392 L240 316"/>
    <path class="ink" d="M345 328 L378 392 L360 316"/>
    <line x1="275" y1="448" x2="325" y2="448" class="ink2"/>
