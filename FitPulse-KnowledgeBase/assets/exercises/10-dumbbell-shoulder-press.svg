  <text x="48" y="90" class="title">10　哑铃肩上推举</text>
  <text x="1152" y="58" text-anchor="end" class="meta">EX-010 · 进阶 · 哑铃</text>
  <text x="1152" y="88" text-anchor="end" class="meta2">上肢 · 垂直推 · 正面视角</text>

  <rect class="card" x="48" y="150" width="536" height="500" rx="24"/>
  <rect class="card" x="616" y="150" width="536" height="500" rx="24"/>
  <text x="80" y="196" class="card-title">起始位</text>
  <text x="552" y="196" text-anchor="end" class="sub">哑铃在肩侧，手腕叠在肘上</text>
  <text x="648" y="196" class="card-title">动作位</text>
  <text x="1120" y="196" text-anchor="end" class="sub">推至头顶，躯干稳定</text>
